name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest tests -q

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No tracked file is gitignored
        run: |
          found=$(git ls-files -i -c --exclude-standard)
          if [ -n "$found" ]; then
            echo "Tracked although .gitignore excludes them:"
            echo "$found"
            exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The plugin eats its own cooking: the validator must pass on this repo.
      - name: Publish surface
        run: python3 scripts/validate.py . --profile release

      - name: Hook is executable and parses
        run: |
          python3 -m py_compile hooks/guard_publish.py scripts/validate.py scripts/scaffold.py scripts/checklist.py scripts/domains.py
